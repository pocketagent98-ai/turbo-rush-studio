name: Turbo Rush Android Build
# studio release pipeline 1.3.0

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.gd'
      - '**.tscn'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/turbo-rush-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GODOT_VERSION: "4.7.2"
      ANDROID_PLATFORM: "android-36"
      ANDROID_BUILD_TOOLS: "36.1.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android packages
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "platforms;android-36" \
            "build-tools;34.0.0" "build-tools;36.1.0"

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot
          curl -L --fail --retry 3 -o /tmp/godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Install export templates
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -L --fail --retry 3 -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -r /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Install project Gradle Android template
        run: |
          set -euo pipefail
          rm -rf android/build
          mkdir -p android/build
          unzip -p /tmp/templates.tpz templates/android_source.zip > /tmp/android_source.zip
          unzip -q /tmp/android_source.zip -d android/build
          test -f android/build/build.gradle
          test -f android/build/gradlew
          printf '%s\n' "4.7.2.stable" > android/.build_version

      - name: Headless import
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --editor --quit 2>&1 | tee /tmp/import.log
          if grep -qE 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/import.log; then
            echo "Godot import detected script errors."
            exit 1
          fi

      - name: Smoke tests
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script res://tests/smoke_test.gd

      - name: Integration test
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script res://tests/integration_test.gd

      - name: Monetization preflight (release gate)
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script res://tools/monetization_preflight.gd

      - name: Prepare release signing
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/turbo-rush-release.jks"
          KEYSTORE_PASS=$(openssl rand -hex 24)
          keytool -genkeypair -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
            -alias turbo_rush -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Turbo Rush, OU=Verma Game Studios, O=Verma Game Studios, L=India, C=IN"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=turbo_rush" >> "$GITHUB_ENV"

      - name: Android release APK
        run: |
          set -euo pipefail
          mkdir -p artifacts
          "$GODOT_BIN" --headless --path . --export-release "Android Release APK" artifacts/TurboRush-v1.3.0-release.apk

      - name: Android release AAB
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --export-release "Android Release AAB" artifacts/TurboRush-v1.3.0-release.aab

      - name: Validate artifacts
        run: |
          set -euo pipefail
          APK="artifacts/TurboRush-v1.3.0-release.apk"
          AAB="artifacts/TurboRush-v1.3.0-release.aab"
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/aapt2" dump badging "$APK" | tee artifacts/APK_BADGING.txt
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/apksigner" verify --verbose "$APK" | tee artifacts/APK_SIGNING.txt
          sha256sum "$APK" | tee artifacts/APK_SHA256.txt
          test -s "$AAB"
          sha256sum "$AAB" | tee artifacts/AAB_SHA256.txt

      - name: Upload release artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Turbo-Rush-v1.3.0-release
          path: |
            artifacts/TurboRush-v1.3.0-release.apk
            artifacts/TurboRush-v1.3.0-release.aab
            artifacts/APK_BADGING.txt
            artifacts/APK_SIGNING.txt
            artifacts/APK_SHA256.txt
            artifacts/AAB_SHA256.txt
          if-no-files-found: error
